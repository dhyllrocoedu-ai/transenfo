services:
  - type: web
    name: tems
    runtime: docker
    repo: https://github.com/dhyllrocoedu-ai/transenfo
    branch: v4.5.0
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://tems.onrender.com
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: tems-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tems-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: tems-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tems-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tems-db
          property: password
      - key: APP_KEY
        generateValue: true

databases:
  - name: tems-db
    databaseName: tems
    plan: free
    region: oregon
